<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Route Map | Bogotá → Paipa</title>
    <link
      rel="stylesheet"
      href="https://unpkg.com/maplibre-gl@3.6.1/dist/maplibre-gl.css"
    />
    <style>
      html,
      body,
      #map {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
      }
    </style>
  </head>
  <body>
    <div id="map"></div>
    <script src="https://unpkg.com/maplibre-gl@3.6.1/dist/maplibre-gl.js"></script>
    <script>
      const map = new maplibregl.Map({
        container: "map",
        style: "https://basemaps.cartocdn.com/gl/dark-matter-gl-style/style.json",
        center: [-73.6, 5.2],
        zoom: 7.2,
        pitch: 40,
        bearing: 0
      });

      map.addControl(new maplibregl.NavigationControl(), "top-right");

      const bogota = [-74.0817, 4.60971];
      const paipa = [-73.12496, 5.758808];

      const fetchRoute = async () => {
        const url =
          "https://router.project-osrm.org/route/v1/driving/" +
          `${bogota[0]},${bogota[1]};${paipa[0]},${paipa[1]}` +
          "?overview=full&geometries=geojson";
        const response = await fetch(url);
        const data = await response.json();
        if (!data.routes || !data.routes.length) {
          throw new Error("No route data");
        }
        return data.routes[0].geometry.coordinates;
      };

      map.on("load", async () => {
        let route = [];
        try {
          route = await fetchRoute();
        } catch (error) {
          route = [bogota, paipa];
        }
        map.addSource("route", {
          type: "geojson",
          data: {
            type: "Feature",
            geometry: { type: "LineString", coordinates: route }
          }
        });


        map.addLayer({
          id: "route-line",
          type: "line",
          source: "route",
          layout: { "line-join": "round", "line-cap": "round" },
          paint: {
            "line-color": "#2a5a4a",
            "line-width": 4,
            "line-opacity": 0.8
          }
        });

        map.addLayer({
          id: "route-glow",
          type: "line",
          source: "route",
          layout: { "line-join": "round", "line-cap": "round" },
          paint: {
            "line-color": "#b7c8be",
            "line-width": 10,
            "line-opacity": 0.25
          }
        });

        map.addSource("dot", {
          type: "geojson",
          data: {
            type: "Feature",
            geometry: { type: "Point", coordinates: route[0] }
          }
        });

        map.addLayer({
          id: "dot",
          type: "circle",
          source: "dot",
          paint: {
            "circle-radius": 6,
            "circle-color": "#2a5a4a",
            "circle-stroke-width": 2,
            "circle-stroke-color": "#ffffff"
          }
        });

        let index = 0;
        const animate = () => {
          index = (index + 1) % route.length;
          map.getSource("dot").setData({
            type: "Feature",
            geometry: { type: "Point", coordinates: route[index] }
          });
          requestAnimationFrame(animate);
        };
        animate();
      });
    </script>
  </body>
</html>
